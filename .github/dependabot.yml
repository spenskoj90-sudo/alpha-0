version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    groups:
      codeql-actions:
        patterns: ["github/codeql-action/*"]

  - package-ecosystem: "npm"
    directories: ["/web", "/site"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    groups:
      vitest-tooling:
        patterns: ["vitest", "@vitest/*"]
      next-tooling:
        patterns: ["next", "eslint-config-next", "@next/*"]
    ignore:
      # Declarations must match the selected Node 24 runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # Current eslint-plugin-react and TypeScript parser peers exclude these majors.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "npm"
    directory: "/launcher"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    ignore:
      # Keep the verified JDK 25 / AGP 9.4 / Gradle 9.7 RC toolchain.
      - dependency-name: "gradle-wrapper"
        versions: [">=9.8"]

  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    ignore:
      # Revisit after physical acceptance with RLS/autoflush migration tests.
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
      # 0.54 adds only opt-in experimental HTTP/2 paths unused by Core.
      - dependency-name: "uvicorn"
        versions: [">=0.54"]
