name: Build & Test

on:
  push:
    branches: [main, sentinel-1.0.0-rc1-final]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash verify.sh

  core:
    name: Core tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m compileall -q app migrate.py
      - run: pytest -m 'not postgres' --cov=app --cov-report=term-missing --cov-fail-under=80

  postgres:
    name: PostgreSQL integration and recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://sentinel:testpass@127.0.0.1:5432/sentinel_test
      SENTINEL_ENV: production
      SENTINEL_ENROLLMENT_TOKEN: pg-smoke:secret
      SENTINEL_REQUIRE_ENROLLMENT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python migrate.py
      - run: pytest -m postgres
      - name: Backup and restore smoke test
        run: |
          pg_dump --no-owner --no-privileges "$DATABASE_URL" > /tmp/sentinel-backup.sql
          PGPASSWORD=testpass psql -h 127.0.0.1 -U sentinel -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS sentinel_restore' -c 'CREATE DATABASE sentinel_restore'
          PGPASSWORD=testpass psql -h 127.0.0.1 -U sentinel -d sentinel_restore -v ON_ERROR_STOP=1 < /tmp/sentinel-backup.sql
          PGPASSWORD=testpass psql -h 127.0.0.1 -U sentinel -d sentinel_restore -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM identities LIMIT 1'

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug
      - run: ./gradlew --no-daemon test

  android-instrumentation:
    name: Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: [core, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: sentinel-core:ci

  deployment-smoke:
    name: Deployment smoke and health
    runs-on: ubuntu-latest
    needs: [core, postgres, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        run: docker build -f server/Dockerfile -t sentinel-core:smoke server
      - name: Start PostgreSQL
        run: |
          docker run -d --name sentinel-postgres -e POSTGRES_DB=sentinel -e POSTGRES_USER=sentinel -e POSTGRES_PASSWORD=testpass -p 5432:5432 postgres:17-alpine
          for i in {1..30}; do pg_isready -h 127.0.0.1 -p 5432 -U sentinel && break; sleep 2; done
      - name: Migrate database
        working-directory: server
        env:
          DATABASE_URL: postgresql://sentinel:testpass@127.0.0.1:5432/sentinel
          SENTINEL_ENV: production
          SENTINEL_ENROLLMENT_TOKEN: smoke:secret
          SENTINEL_REQUIRE_ENROLLMENT: "true"
        run: |
          python -m pip install '.[test]'
          python migrate.py
      - name: Start API and verify health
        run: |
          docker run -d --name sentinel-api --network host -e DATABASE_URL=postgresql://sentinel:testpass@127.0.0.1:5432/sentinel -e SENTINEL_ENV=production -e SENTINEL_ENROLLMENT_TOKEN=smoke:secret -e SENTINEL_REQUIRE_ENROLLMENT=true sentinel-core:smoke
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 2; done
          docker logs sentinel-api
          exit 1
      - name: Cleanup deployment smoke
        if: always()
        run: docker rm -f sentinel-api sentinel-postgres 2>/dev/null || true
