name: Branch Hygiene

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-branch-hygiene-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  review-live-branches:
    name: Review live branches (no deletion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"

      # v2.4 inventory/independent restore/Owner gates have NOT passed.
      # Historical classifications never authorize deleting a live branch.
      # Reintroducing mutation requires a separately reviewed implementation.
      - name: Read live branch inventory without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/branches?per_page=100" > "$RUNNER_TEMP/branch-review.json"
          python3 - "$RUNNER_TEMP/branch-review.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          pages = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          branches = [
              {"name": branch["name"], "sha": branch["commit"]["sha"],
               "protected": branch["protected"]}
              for page in pages for branch in page
          ]
          print(json.dumps({"status": "REVIEW_REQUIRED", "deleted": 0,
                            "branches": branches}, ensure_ascii=True))
          PY

