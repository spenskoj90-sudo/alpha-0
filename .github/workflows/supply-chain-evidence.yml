name: Supply Chain Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-evidence:
    name: Supply-chain SBOM evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SENTINEL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SENTINEL_IMAGE: sentinel-core:supply-chain
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Setup Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run supply-chain contract tests
        run: |
          python scripts/test_supply_chain_evidence.py
          python scripts/test_artifact_attestations.py

      - name: Build exact-source Core runtime image
        run: |
          set -euo pipefail
          docker build --build-arg SOURCE_DATE_EPOCH=0 -f server/Dockerfile -t "$SENTINEL_IMAGE" .
          mkdir -p artifacts/supply-chain/inputs
          docker image inspect "$SENTINEL_IMAGE" --format '{{.Id}}' > artifacts/supply-chain/inputs/container-image-id.txt
          docker run --rm --entrypoint python "$SENTINEL_IMAGE" -m pip list --format=json > artifacts/supply-chain/inputs/python-runtime.json

      - name: Generate Core container CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sentinel-core:supply-chain
          format: cyclonedx
          output: artifacts/supply-chain/inputs/container.cdx.json
          exit-code: 0

      - name: Capture resolved Web Android and Companion inventories
        run: |
          set -euo pipefail
          cp web/package-lock.json artifacts/supply-chain/inputs/web-package-lock.json
          cp launcher/package.json artifacts/supply-chain/inputs/launcher-package.json
          chmod +x gradlew
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > artifacts/supply-chain/inputs/android-debug-runtime.txt

      - name: Build exact-SHA supply-chain evidence
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/supply_chain_evidence.py build \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SENTINEL_SOURCE_SHA" \
            --version "$version" \
            --python-runtime artifacts/supply-chain/inputs/python-runtime.json \
            --web-lock artifacts/supply-chain/inputs/web-package-lock.json \
            --gradle-deps artifacts/supply-chain/inputs/android-debug-runtime.txt \
            --launcher-package artifacts/supply-chain/inputs/launcher-package.json \
            --container-sbom artifacts/supply-chain/inputs/container.cdx.json \
            --container-image-id artifacts/supply-chain/inputs/container-image-id.txt \
            --output-dir artifacts/supply-chain

      - name: Verify supply-chain evidence independently
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/supply_chain_evidence.py verify \
            --input-dir artifacts/supply-chain \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-sha "$SENTINEL_SOURCE_SHA" \
            --expected-version "$version"

      - name: Upload exact-SHA supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-supply-chain-evidence-${{ env.SENTINEL_SOURCE_SHA }}
          path: artifacts/supply-chain/
          if-no-files-found: error
          retention-days: 90

  attest-supply-chain:
    name: Attest protected-main supply-chain evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: supply-chain-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SENTINEL_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Download verified supply-chain evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sentinel-supply-chain-evidence-${{ env.SENTINEL_SOURCE_SHA }}
          path: attestation-input

      - name: Require canonical attestation subjects
        run: |
          set -euo pipefail
          test -s attestation-input/supply-chain-evidence.json
          test -s attestation-input/sentinel-application.cdx.json
          test -s attestation-input/sentinel-core-container.cdx.json

      - name: Attest exact protected-main supply-chain evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            attestation-input/supply-chain-evidence.json
            attestation-input/sentinel-application.cdx.json
            attestation-input/sentinel-core-container.cdx.json
