<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>SENTINEL Launcher</title>
  <style>
    body{margin:0;background:#070a0d;color:#e7edf2;font-family:system-ui;padding:32px}.brand{letter-spacing:.18em;font-weight:800}.sub{color:#8996a3}.panel{margin-top:24px;border:1px solid #1d2832;background:#0d1217;border-radius:16px;padding:20px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}.field label{font-size:12px;color:#8996a3}.field input{background:#070a0d;color:#e7edf2;border:1px solid #2c3944;border-radius:8px;padding:10px}.status{margin-top:14px;padding:10px;border-radius:8px;background:#070a0d}.ok{color:#9acb52}.warn{color:#f3ba63}.err{color:#ff6b6b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.card{border:1px solid #1d2832;background:#0d1217;border-radius:16px;padding:20px}.btn{margin-top:14px;background:#9acb52;color:#070a0d;border:0;border-radius:10px;padding:10px 14px;font-weight:700}.btn.secondary{background:#28343d;color:#e7edf2}.btn:disabled{opacity:.5}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:900px){.grid{grid-template-columns:1fr}.row{display:block}.field{margin-top:10px}}
  </style>
</head>
<body>
  <div class="brand">SENTINEL</div>
  <div class="sub">SECURE GAME CONTROL PLANE</div>

  <section class="panel" aria-labelledby="account-title">
    <strong id="account-title">ACCOUNT / COMPANION</strong>
    <div class="row">
      <div class="field"><label for="core-url">CORE URL</label><input id="core-url" value="http://127.0.0.1:8080" autocomplete="url"></div>
      <div class="field"><label for="email">EMAIL</label><input id="email" type="email" autocomplete="username"></div>
      <div class="field"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div>
    </div>
    <div class="actions">
      <button id="login" class="btn">SIGN IN</button>
      <button id="logout" class="btn secondary" disabled>SIGN OUT</button>
      <button id="companion-start" class="btn" disabled>START COMPANION</button>
      <button id="companion-stop" class="btn secondary" disabled>STOP / KILL SWITCH</button>
    </div>
    <div id="account-status" class="status">ACCOUNT: SIGNED OUT</div>
    <div id="companion-status" class="status">COMPANION: STOPPED</div>
  </section>

  <div id="grid" class="grid"></div>
  <script src="renderer.js"></script>
</body>
</html>
