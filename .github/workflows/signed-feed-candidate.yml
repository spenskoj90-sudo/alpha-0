name: Signed Feed Candidate Artifact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main SHA with separately reviewed PROJECTS approval
        required: true
        type: string
      api_base_url:
        description: Approved HTTPS Core origin
        required: true
        type: string
      vk_client_id:
        description: Public VK ID (0 when disabled)
        default: "0"
        type: string

permissions:
  actions: read
  contents: read
  checks: read
  attestations: read

concurrency:
  group: signed-feed-candidate
  cancel-in-progress: false
  queue: max

jobs:
  presecret:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.binding.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Verify protected source, approved feed and independent baseline before secrets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          python scripts/signed_feed_candidate.py presecret --sha "$SOURCE_SHA" \
            --aapt2 "$aapt2" --apksigner "$apksigner" --output signed-feed-presecret-binding.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Compile and inspect non-Play payload before protected secrets
        id: binding
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SENTINEL_SOURCE_SHA: ${{ inputs.source_sha }}
          SENTINEL_API_BASE_URL: ${{ inputs.api_base_url }}
          SENTINEL_VK_CLIENT_ID: ${{ inputs.vk_client_id }}
          SENTINEL_RUNTIME_ENVIRONMENT: release-candidate
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/presecret.jks"' EXIT
          keytool -genkeypair -keystore "$RUNNER_TEMP/presecret.jks" -alias isolated \
            -storepass isolated-only -keypass isolated-only -dname CN=SyntheticPresecret \
            -keyalg RSA -keysize 2048 -validity 1 >/dev/null 2>&1
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/presecret.jks"
          export ANDROID_KEYSTORE_PASSWORD=isolated-only ANDROID_KEY_ALIAS=isolated ANDROID_KEY_PASSWORD=isolated-only
          export SENTINEL_UPDATE_FEED_URL="$(python -c 'import json; print(json.load(open("signed-feed-presecret-binding.json"))["policy"]["feedUrl"])')"
          export SENTINEL_UPDATE_FEED_VERIFYING_KEY="$(python -c 'import json; print(json.load(open("signed-feed-presecret-binding.json"))["policy"]["verifyingKey"])')"
          bash ./gradlew --no-daemon assembleSignedRelease
          cp app/build/outputs/apk/signedRelease/app-signedRelease.apk presecret-signed-feed.apk
          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          python scripts/signed_feed_candidate.py bind-compiled --sha "$SOURCE_SHA" \
            --aapt2 "$aapt2" --apksigner "$apksigner" --binding signed-feed-presecret-binding.json \
            --apk presecret-signed-feed.apk --output compiled-binding.json
          mv compiled-binding.json signed-feed-presecret-binding.json
          echo "digest=$(sha256sum signed-feed-presecret-binding.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-signed-feed-presecret-${{ inputs.source_sha }}
          path: |
            signed-feed-presecret-binding.json
            presecret-signed-feed.apk
          if-no-files-found: error

  signed-feed:
    needs: presecret
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: sentinel-release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      apk: ${{ steps.hashes.outputs.apk }}
      candidate: ${{ steps.hashes.outputs.candidate }}
      binding: ${{ steps.hashes.outputs.binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sentinel-signed-feed-presecret-${{ inputs.source_sha }}
          path: presecret-input
      - name: Revalidate all independent evidence before private-key access
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_DIGEST: ${{ needs.presecret.outputs.digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          python scripts/signed_feed_candidate.py verify-compiled --sha "$SOURCE_SHA" \
            --aapt2 "$aapt2" --apksigner "$apksigner" --binding presecret-input/signed-feed-presecret-binding.json \
            --apk presecret-input/presecret-signed-feed.apk --output signed-feed-presecret-binding.json
          test "$(sha256sum signed-feed-presecret-binding.json | cut -d' ' -f1)" = "$EXPECTED_DIGEST"
      - name: Decode existing release keystore (Owner environment gate)
        env:
          KEYSTORE_BASE64: ${{ secrets.SENTINEL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          python - <<'PY'
          import base64, os, pathlib
          raw = ''.join(os.environ['KEYSTORE_BASE64'].split())
          data = base64.b64decode(raw + '=' * (-len(raw) % 4), validate=True)
          if not data: raise SystemExit('empty keystore')
          path = pathlib.Path(os.environ['RUNNER_TEMP'], 'signed-feed.jks')
          path.write_bytes(data)
          path.chmod(0o600)
          PY
      - name: Sign presecret-inspected payload with existing lineage
        env:
          STORE_PASSWORD: ${{ secrets.SENTINEL_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SENTINEL_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SENTINEL_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p app/build/outputs/apk/signedRelease
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$apksigner" sign --ks "$RUNNER_TEMP/signed-feed.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out app/build/outputs/apk/signedRelease/app-signedRelease.apk presecret-input/presecret-signed-feed.apk
      - name: Inspect actual signed bytes and compiled constants
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir signed-feed-candidate-package
          cp app/build/outputs/apk/signedRelease/app-signedRelease.apk signed-feed-candidate-package/
          cp signed-feed-presecret-binding.json signed-feed-candidate-package/
          aapt2="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort -V | tail -1)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          python scripts/signed_feed_candidate.py inspect --sha "$SOURCE_SHA" \
            --aapt2 "$aapt2" --apksigner "$apksigner" --binding signed-feed-presecret-binding.json \
            --apk signed-feed-candidate-package/app-signedRelease.apk \
            --output signed-feed-candidate-package/signed-feed-candidate.json
      - name: Hash retained subjects
        id: hashes
        run: |
          set -euo pipefail
          echo "apk=$(sha256sum signed-feed-candidate-package/app-signedRelease.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "candidate=$(sha256sum signed-feed-candidate-package/signed-feed-candidate.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "binding=$(sha256sum signed-feed-candidate-package/signed-feed-presecret-binding.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-signed-feed-candidate-${{ inputs.source_sha }}
          path: signed-feed-candidate-package/*
          if-no-files-found: error
          retention-days: 90
      - name: Remove ephemeral copy of existing signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/signed-feed.jks"

  attest-signed-feed:
    needs: signed-feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sentinel-signed-feed-candidate-${{ inputs.source_sha }}
          path: signed-feed-attestation
      - name: Verify exact subjects before attesting
        env:
          APK: ${{ needs.signed-feed.outputs.apk }}
          CANDIDATE: ${{ needs.signed-feed.outputs.candidate }}
          BINDING: ${{ needs.signed-feed.outputs.binding }}
        run: |
          set -euo pipefail
          test "$(sha256sum signed-feed-attestation/app-signedRelease.apk | cut -d' ' -f1)" = "$APK"
          test "$(sha256sum signed-feed-attestation/signed-feed-candidate.json | cut -d' ' -f1)" = "$CANDIDATE"
          test "$(sha256sum signed-feed-attestation/signed-feed-presecret-binding.json | cut -d' ' -f1)" = "$BINDING"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            signed-feed-attestation/app-signedRelease.apk
            signed-feed-attestation/signed-feed-candidate.json
            signed-feed-attestation/signed-feed-presecret-binding.json
