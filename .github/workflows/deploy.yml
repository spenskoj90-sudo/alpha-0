name: Deploy

# A published GitHub Release may publish the exact-source container image only after
# publication acceptance. Remote rollout is never an automatic side effect of release
# publication: it requires a separate Owner workflow_dispatch plus deployment-profile
# final acceptance and Owner-managed DEPLOY_* configuration.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact published version tag to deploy (for example v1.0.0-rc2)"
        required: true
        type: string

permissions:
  contents: read

env:
  SENTINEL_RELEASE_SIGNER_SHA256: "2A:CD:1C:FF:F4:F3:4D:B1:25:0D:3F:6C:81:F0:88:74:93:C4:60:2D:3C:FA:65:31:09:93:C0:58:08:9D:B8:8E"

jobs:
  preflight:
    name: Verify exact release identity and publication acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      attestations: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Resolve requested release tag
        id: requested
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag="$DISPATCH_TAG"
          fi
          case "$tag" in
            v*.*.*) ;;
            *) echo "Deploy requires an exact v*.*.* version tag"; exit 1 ;;
          esac
          printf '%s' "$tag" > "$RUNNER_TEMP/requested-tag"

      - name: Checkout exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact source SHA and version
        id: identity
        run: |
          set -euo pipefail
          tag="$(cat "$RUNNER_TEMP/requested-tag")"
          source_sha="$(git rev-parse HEAD)"
          case "$source_sha" in
            *[!0-9a-f]*|'') echo "resolved source SHA is invalid"; exit 1 ;;
          esac
          test "${#source_sha}" -eq 40
          expected="$(tr '[:upper:]' '[:lower:]' < VERSION | tr -d '[:space:]')"
          actual="$(printf '%s' "${tag#v}" | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          test "$(git rev-list -n 1 "$tag")" = "$source_sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Verify publication-profile final acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          bash scripts/verify_final_release_acceptance_live.sh \
            "$GITHUB_REPOSITORY" \
            "$SOURCE_SHA" \
            "$SENTINEL_RELEASE_SIGNER_SHA256" \
            publication \
            "$RUNNER_TEMP/publication-acceptance"

  publish:
    name: Build and publish exact release images
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact accepted release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          persist-credentials: false

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sentinel-core:${{ needs.preflight.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/sentinel-core:latest

  deployment-acceptance:
    name: Verify deployment-profile acceptance for Owner rollout
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - name: Checkout exact accepted release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Verify deployment-profile final acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          bash scripts/verify_final_release_acceptance_live.sh \
            "$GITHUB_REPOSITORY" \
            "$SOURCE_SHA" \
            "$SENTINEL_RELEASE_SIGNER_SHA256" \
            deployment \
            "$RUNNER_TEMP/deployment-acceptance"

  remote:
    name: Owner-dispatched remote rollout
    needs: [preflight, publish, deployment-acceptance]
    if: ${{ github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true' && needs.deployment-acceptance.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require deploy secrets when explicitly enabled
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_USER:-}" ] || [ -z "${DEPLOY_KEY:-}" ]; then
            echo "DEPLOY_ENABLED=true but DEPLOY_HOST/USER/KEY secrets are missing."
            exit 1
          fi

      - uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd /opt/sentinel
            docker compose pull core
            docker compose up -d --remove-orphans core
            docker image prune -f
