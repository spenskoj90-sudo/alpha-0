name: ALPHA-0 Android CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  changes:
    uses: ./.github/workflows/change-classification.yml

  build:
    needs: [changes]
    if: ${{ needs.changes.outputs.android == 'true' }}
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Make Gradle bootstrap executable
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Run Unit Tests
        run: ./gradlew --no-daemon --stacktrace test
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Create non-installable debug build receipt
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/app-debug.apk > android-debug-ci.sha256
          printf '%s\n' \
            'CI ONLY - NOT AN INSTALLER. Do not sideload onto any Owner device.' \
            'The APK is signed with a disposable runner-specific debug key.' \
            'Only permanently signed test/release channels may distribute installable APKs.' \
            > ANDROID_DEBUG_CI_ONLY.txt

      - name: Upload CI-only debug build evidence (never APK bytes)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alpha-0-debug-ci-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android-debug-ci.sha256
            ANDROID_DEBUG_CI_ONLY.txt
          if-no-files-found: error
          retention-days: 14
