name: Sync CURRENT_STATE HEAD

on:
  push:
    branches: [main]

# contents: create branch + commit; pull-requests: open PR.
# No direct push to protected main.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync-head:
    name: Open CURRENT_STATE HEAD sync PR
    runs-on: ubuntu-latest
    # Skip re-entrancy: auto-sync merges and [skip ci] commits must not open another PR.
    if: >-
      ${
        !contains(github.event.head_commit.message, '[skip ci]')
        && !contains(github.event.head_commit.message, 'auto-sync CURRENT_STATE')
      }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect and patch observed snapshot HEAD if stale
        id: patch
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os, re, sys

          path = "docs/SENTINEL_CURRENT_STATE.md"
          sha = os.environ["TARGET_SHA"]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          pattern = r"(\*\*Observed `main` HEAD \(snapshot\):\*\* `)[0-9a-f]{40}(`)"
          m = re.search(pattern, text)
          if not m:
              print("ERROR: Observed main HEAD (snapshot) pattern not found")
              sys.exit(1)

          current = m.group(0)
          cur_sha = re.search(r"`([0-9a-f]{40})`", current)
          cur_sha = cur_sha.group(1) if cur_sha else "?"

          if cur_sha == sha:
              print(f"Idempotent: observed snapshot HEAD already {sha}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("changed=false\n")
              sys.exit(0)

          new_text, n = re.subn(pattern, r"\g<1>" + sha + r"\g<2>", text, count=1)
          if n != 1:
              print(f"ERROR: expected exactly 1 observed snapshot replacement, got {n}")
              sys.exit(1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(new_text)

          print(f"Patched observed snapshot HEAD: {cur_sha} -> {sha}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("changed=true\n")
              out.write(f"target_sha={sha}\n")
          PY

      - name: Create branch, commit, open PR
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          BRANCH="ci/state-sync-auto-${TARGET_SHA}"
          TITLE="chore: auto-sync CURRENT_STATE observed HEAD to ${TARGET_SHA}"
          BODY=$(cat <<EOF
          ## Auto-sync observed CURRENT_STATE HEAD

          Triggered by push to \`main\` at \`${TARGET_SHA}\`.

          This PR updates only the **Observed \`main\` HEAD (snapshot)** line in
          \`docs/SENTINEL_CURRENT_STATE.md\` to match the triggering SHA.

          - **No product code changes**
          - **Do not auto-merge** — Owner reviews and merges after CI
          - The snapshot remains explicitly non-self-referential

          Generated by workflow \`sync-current-state.yml\` (github-actions[bot]).

          **CI note (Issue #154):** The commit does **not** use \`[skip ci]\`.
          Required workflows are configured to also run on push to
          \`ci/state-sync-auto-*\` branches so status checks report on this
          head SHA without manual workflow approval and without extra secrets.
          EOF
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reuse a branch already created for this exact TARGET_SHA on a rerun.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "Reusing existing sync branch $BRANCH"
          else
            # Branch from the exact commit that triggered this run.
            git checkout -b "$BRANCH"
            git add docs/SENTINEL_CURRENT_STATE.md
            # No [skip ci]: required checks must run on this SHA via push triggers
            # for ci/state-sync-auto-* (see Issue #154).
            git commit -m "chore: auto-sync CURRENT_STATE observed HEAD to ${TARGET_SHA}"
            git push -u origin "$BRANCH"
          fi

          # Avoid duplicate open PRs for the same branch.
          if gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$BODY"
            echo "Opened PR for observed CURRENT_STATE HEAD -> ${TARGET_SHA}"
          else
            echo "Open PR already exists for ${BRANCH}; skipping create"
          fi
