services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      SENTINEL_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}
      SENTINEL_ENROLLMENT_TOKEN: ${SENTINEL_ENROLLMENT_TOKEN:?SENTINEL_ENROLLMENT_TOKEN is required}
      SENTINEL_REQUIRE_ENROLLMENT: "true"
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      MAX_REQUEST_SKEW_SECONDS: ${MAX_REQUEST_SKEW_SECONDS:-120}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
