name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sentinel-core:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/sentinel-core:latest

  remote:
    name: Optional remote rollout
    runs-on: ubuntu-latest
    needs: publish
    # IMPORTANT: secrets context is forbidden in job-level `if` expressions.
    # Using secrets.DEPLOY_* in `if` made every push report "Invalid workflow file"
    # and triggered failure emails (Deploy noise). Gate inside a step instead.
    steps:
      - name: Detect deploy secrets
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${DEPLOY_HOST:-}" ] && [ -n "${DEPLOY_USER:-}" ] && [ -n "${DEPLOY_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_* secrets not configured — remote rollout skipped (expected)."
          fi
      - name: Remote rollout
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            cd /opt/sentinel
            docker compose pull core
            docker compose up -d --remove-orphans core
            docker image prune -f
