name: SENTINEL Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Signed release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.1
      - name: Install pinned Android build tools
        run: sdkmanager "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-version: "8.9"
      - name: Materialize signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ALPHA0_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          mkdir -p "$RUNNER_TEMP/sentinel"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sentinel/release.keystore"
          test -s "$RUNNER_TEMP/sentinel/release.keystore"
      - name: Build signed release APK
        env:
          ALPHA0_KEYSTORE_PATH: ${{ runner.temp }}/sentinel/release.keystore
          ALPHA0_KEYSTORE_PASSWORD: ${{ secrets.ALPHA0_KEYSTORE_PASSWORD }}
          ALPHA0_KEY_ALIAS: ${{ secrets.ALPHA0_KEY_ALIAS }}
          ALPHA0_KEY_PASSWORD: ${{ secrets.ALPHA0_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify release signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 29 "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release.apk.sha256 \
            --generate-notes
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/sentinel"
