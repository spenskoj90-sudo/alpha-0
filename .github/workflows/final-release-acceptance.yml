name: Final Release Acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact protected-main SHA and signed candidate source"
        required: true
        type: string
      profile:
        description: "Acceptance strength to record"
        required: true
        type: choice
        options:
          - publication
          - deployment
          - production-traffic
      manifest_b64:
        description: "Base64 canonical final-release-acceptance.json produced after real acceptance"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  attestations: read

concurrency:
  group: final-release-acceptance-${{ inputs.source_sha }}-${{ inputs.profile }}
  cancel-in-progress: false

env:
  SENTINEL_RELEASE_SIGNER_SHA256: "2A:CD:1C:FF:F4:F3:4D:B1:25:0D:3F:6C:81:F0:88:74:93:C4:60:2D:3C:FA:65:31:09:93:C0:58:08:9D:B8:8E"

jobs:
  validate-final-acceptance:
    name: Validate exact-candidate final acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      acceptance_digest: ${{ steps.acceptance.outputs.digest }}
    steps:
      - name: Require dispatch from exact protected-main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo "source_sha must be lowercase hexadecimal"; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          test "$GITHUB_SHA" = "$SOURCE_SHA"

      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Run final-acceptance contract tests
        run: python scripts/test_final_release_acceptance.py

      - name: Verify protected-main release evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash scripts/verify_release_evidence_attestation.sh \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$RUNNER_TEMP/release-evidence"

      - name: Rebuild exact pre-secret binding and fetch Owner-signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/release_lineage.py presecret \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SOURCE_SHA"
          bash scripts/write_release_presecret_binding.sh \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$version" "$RUNNER_TEMP/release-presecret-binding.json"
          python scripts/release_lineage.py verify-binding \
            --input "$RUNNER_TEMP/release-presecret-binding.json" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-sha "$SOURCE_SHA" \
            --expected-version "$version"
          python scripts/release_lineage.py fetch-candidate \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SOURCE_SHA" \
            --binding "$RUNNER_TEMP/release-presecret-binding.json" \
            --expected-signer-sha256 "$SENTINEL_RELEASE_SIGNER_SHA256" \
            --output-dir "$RUNNER_TEMP/candidate"

      - name: Verify signed candidate artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          for subject in \
            "$RUNNER_TEMP/candidate/app-release.apk" \
            "$RUNNER_TEMP/candidate/release-candidate.json" \
            "$RUNNER_TEMP/candidate/release-presecret-binding.json"
          do
            bash scripts/verify_github_attestation.sh \
              "$subject" \
              "$GITHUB_REPOSITORY" \
              ".github/workflows/release-candidate.yml" \
              "$SOURCE_SHA" \
              "refs/heads/main"
          done

      - name: Verify exact protected-main packaged Companion provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/verify_release_upstream_attestations.sh \
            "$RUNNER_TEMP/release-evidence/release-evidence.json" \
            "$RUNNER_TEMP/upstream"

      - name: Decode bounded Owner acceptance manifest
        env:
          MANIFEST_B64: ${{ inputs.manifest_b64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, binascii, os, pathlib
          raw = os.environ["MANIFEST_B64"].strip()
          if not raw or len(raw) > 180000:
              raise SystemExit("manifest_b64 is empty or exceeds input safety limit")
          try:
              data = base64.b64decode(raw, validate=True)
          except binascii.Error as exc:
              raise SystemExit("manifest_b64 is not valid base64") from exc
          if not data or len(data) > 131072:
              raise SystemExit("decoded final acceptance manifest exceeds 128 KiB")
          data.decode("utf-8")
          pathlib.Path("final-release-acceptance.json").write_bytes(data)
          PY

      - name: Verify final acceptance against exact signed and packaged bytes
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          test "$(jq -r '.profile' final-release-acceptance.json)" = "$PROFILE"
          mapfile -t package_sha_files < <(find "$RUNNER_TEMP/upstream/packaged-companion" -type f -name archive-sha256.txt -print)
          test "${#package_sha_files[@]}" -eq 1
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/final_release_acceptance.py verify \
            --input final-release-acceptance.json \
            --candidate "$RUNNER_TEMP/candidate/release-candidate.json" \
            --apk "$RUNNER_TEMP/candidate/app-release.apk" \
            --companion-sha256-file "${package_sha_files[0]}" \
            --minimum-profile "$PROFILE" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-sha "$SOURCE_SHA" \
            --expected-version "$version"

      - name: Export canonical acceptance digest
        id: acceptance
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open("final-release-acceptance.json", encoding="utf-8"))
          print("digest=" + value["acceptanceDigest"])
          PY

      - name: Upload exact-candidate final acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-final-release-acceptance-${{ inputs.source_sha }}
          path: final-release-acceptance.json
          if-no-files-found: error
          retention-days: 90

  attest-final-acceptance:
    name: Attest exact-candidate final acceptance
    needs: validate-final-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download validated final acceptance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sentinel-final-release-acceptance-${{ inputs.source_sha }}
          path: attestation-input

      - name: Require canonical final acceptance subject
        run: |
          set -euo pipefail
          test -s attestation-input/final-release-acceptance.json
          test "$(find attestation-input -type f | wc -l)" -eq 1

      - name: Attest final release acceptance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: attestation-input/final-release-acceptance.json
