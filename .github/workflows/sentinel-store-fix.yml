name: SENTINEL temporary store fix

on:
  push:
    branches:
      - sentinel/final-integrator-safe-2026-08-27

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel/final-integrator-safe-2026-08-27
          fetch-depth: 0
      - name: Fix PostgreSQL typed UUID parameter
        env:
          TARGET_BRANCH: sentinel/final-integrator-safe-2026-08-27
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('server/app/core/store.py')
          s = p.read_text()
          old = 'CASE WHEN :device_id IS NULL THEN NULL ELSE CAST(:device_id AS uuid) END'
          new = 'CAST(:device_id AS uuid)'
          if old not in s:
              raise SystemExit('typed UUID anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/sentinel-store-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app/core/store.py .github/workflows/sentinel-store-fix.yml
          git commit -m "fix: type PostgreSQL session device parameter"
          git push origin HEAD:${TARGET_BRANCH}
