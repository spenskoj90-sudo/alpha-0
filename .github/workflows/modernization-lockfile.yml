name: Modernization Lockfile Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-lockfile:
    name: Resolve modern Web lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Resolve package lock without lifecycle scripts
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Validate lock/package agreement
        working-directory: web
        run: npm ci --ignore-scripts --no-audit
      - name: Upload resolved lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modernization-web-lock
          path: web/package-lock.json
          if-no-files-found: error
          retention-days: 1
