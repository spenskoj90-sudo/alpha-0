name: P1 Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p1-evidence:
    name: P1 evidence artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install server and audit tooling
        working-directory: server
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install '.[test]'

      - name: Generate Python SCA report
        working-directory: server
        run: |
          mkdir -p ../artifacts
          set +e
          pip-audit --format json --output ../artifacts/pip-audit.json
          rc=$?
          set -e
          cat ../artifacts/pip-audit.json
          exit $rc

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate web SCA report
        working-directory: web
        run: |
          npm ci
          mkdir -p ../artifacts
          set +e
          npm audit --json > ../artifacts/npm-audit.json
          rc=$?
          set -e
          cat ../artifacts/npm-audit.json
          exit $rc

      - name: Generate Gradle dependency report
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > artifacts/gradle-dependencies.txt

      - name: Run P1 unit/performance evidence
        working-directory: server
        run: |
          pytest -q tests/test_p1_runtime.py tests/test_performance.py | tee ../artifacts/p1-performance.txt

      - name: Upload P1 evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-p1-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
