name: SENTINEL Server CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Server compile and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python -m compileall -q app

      - name: Run security and API tests
        run: |
          set -euo pipefail
          pytest -q

      - name: Reject unfinished implementation markers
        working-directory: .
        run: |
          set -euo pipefail
          if grep -RInE '\\b(TODO|FIXME|IMPLEMENT[[:space:]]+LATER)\\b' server/app server/tests server/migrations; then
            echo "Unfinished implementation marker detected"
            exit 1
          fi
