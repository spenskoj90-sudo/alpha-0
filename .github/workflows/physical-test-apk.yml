name: Physical Test APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physical-test-apk:
    name: Build physical test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build isolated physical-test APK
        env:
          SENTINEL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SENTINEL_RUNTIME_ENVIRONMENT: ci
        run: ./gradlew --no-daemon assemblePhysicalTest

      - name: Verify physical-test identity and production separation
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/physicalTest/app-physicalTest.apk
          grep -F 'applicationIdSuffix = ".physicaltest"' app/build.gradle.kts
          grep -F 'SENTINEL_DIAGNOSTICS_MODE", "\"FORENSIC_TEST\"' app/build.gradle.kts
          grep -F 'SENTINEL_DIAGNOSTICS_MODE", "\"PRODUCTION\"' app/build.gradle.kts
          grep -F 'SENTINEL_DIAGNOSTICS_EXPORT_ENABLED", "false"' app/build.gradle.kts
          grep -F 'if (diagnostics.isForensicTest())' app/src/main/java/com/alpha0/app/SentinelApplication.kt

      - name: Hash physical-test APK
        run: sha256sum app/build/outputs/apk/physicalTest/app-physicalTest.apk | tee physical-test-apk.sha256

      - name: Upload exact-SHA physical-test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-physical-test-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/physicalTest/app-physicalTest.apk
            physical-test-apk.sha256
          if-no-files-found: error
          retention-days: 90
