name: SENTINEL temporary final patch

on:
  push:
    branches:
      - sentinel/final-integrator-safe-2026-08-27

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel/final-integrator-safe-2026-08-27
          fetch-depth: 0

      - name: Apply source-preserving final wiring
        env:
          TARGET_BRANCH: sentinel/final-integrator-safe-2026-08-27
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/app/main.py')
          s = p.read_text()
          old = 'from app.core.integrity import IntegrityNonceStore, IntegrityTier\n'
          new = 'from app.core.integrity import IntegrityNonceStore, IntegrityTier, PlayIntegrityVerifier\n'
          if old not in s:
              raise SystemExit('main.py import anchor not found')
          s = s.replace(old, new, 1)

          old = 'integrity_nonces = IntegrityNonceStore()\n'
          new = 'integrity_nonces = IntegrityNonceStore()\nplay_integrity = PlayIntegrityVerifier()\n'
          if old not in s:
              raise SystemExit('main.py integrity instance anchor not found')
          s = s.replace(old, new, 1)

          login_re = re.compile(r'@app\.post\("/v1/auth/login", response_model=SessionResponse\)\ndef login_user\(payload: LoginRequest, request: Request\):\n.*?\n\n@app\.post\("/v1/devices/register"', re.S)
          login_new = '''@app.post("/v1/auth/login", response_model=SessionResponse)\ndef login_user(payload: LoginRequest, request: Request):\n    rate_limit(request, "auth-login")\n    subject = payload.email.strip().lower()\n    threshold = int(os.getenv("SENTINEL_AUTH_LOCKOUT_THRESHOLD", "8"))\n    if subject and store.security_failure_count(subject) >= threshold:\n        raise HTTPException(status_code=429, detail="AUTH_LOCKOUT")\n    user_id = user_store.authenticate(payload.email, payload.password)\n    if not user_id:\n        if subject:\n            store.record_security_failure(subject, "auth-login")\n        raise HTTPException(status_code=401, detail="INVALID_CREDENTIALS")\n    access, refresh, expires_at, scopes = store.issue_session(None, user_id, SESSION_TTL_SECONDS, REFRESH_TTL_SECONDS)\n    user_store.restrict_session_scopes(store, access, {"character:read", "game:read", "audit:read"})\n    scopes = ["character:read", "game:read", "audit:read"]\n    store.add_audit({"actor_user_id": user_id, "actor_device_id": None, "action": "auth:login", "resource": "session", "decision": "ALLOW", "reason_code": "CREDENTIALS_VALID", "request_id": request_id(request)})\n    return SessionResponse(session_token=access, refresh_token=refresh, expires_at=expires_at, scopes=scopes)\n\n\n@app.post("/v1/devices/register"'''
          s, n = login_re.subn(login_new, s, count=1)
          if n != 1:
              raise SystemExit('main.py login anchor not found')

          attest_re = re.compile(r'@app\.post\("/v1/integrity/attest"\).*?(?=\n@app\.post\("/v1/recommendations")', re.S)
          attest_new = '''@app.post("/v1/integrity/attest")\ndef attest_integrity(payload: dict[str, object], request: Request, authorization_header: str = Header(..., alias="Authorization")) -> dict[str, object]:\n    rate_limit(request, "integrity-attest")\n    principal_from_token(require_bearer(authorization_header))\n    nonce = str(payload.get("nonce") or "")\n    if not integrity_nonces.consume(nonce):\n        raise HTTPException(status_code=401, detail="INTEGRITY_NONCE_INVALID")\n    token = str(payload.get("integrity_token") or "")\n    if not token:\n        raise HTTPException(status_code=401, detail="INTEGRITY_TOKEN_REQUIRED")\n    # Client verdicts are deliberately ignored; only the server verifier may establish trust.\n    result = play_integrity.verify(token, nonce)\n    return {\n        "tier": result.tier.value,\n        "reason": result.reason,\n        "trusted": result.trusted,\n        "package_name": result.package_name,\n    }\n'''
          s, n = attest_re.subn(attest_new, s, count=1)
          if n != 1:
              raise SystemExit('main.py attest anchor not found')
          p.write_text(s)

          q = Path('server/app/core/integrity.py')
          t = q.read_text()
          t2 = t.replace('    def configured(self) -> bool:\n        return bool(self.audience)\n', '    def configured(self) -> bool:\n        return bool(self.audience and self.package_name and self.cert_digest)\n', 1)
          if t2 == t:
              raise SystemExit('integrity configured anchor not found')
          t2 = t2.replace('        if app_recognition and app_recognition not in {"PLAY_RECOGNIZED", "UNRECOGNIZED_VERSION"}:\n            # UNEVALUATED / other → fail closed for trusted path\n            if app_recognition not in {"PLAY_RECOGNIZED", "UNRECOGNIZED_VERSION"}:\n                pass\n        if app_recognition in {"UNEVALUATED"}:\n', '        if app_recognition != "PLAY_RECOGNIZED":\n', 1)
          q.write_text(t2)
          PY

          rm -f .github/workflows/sentinel-auto-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app/main.py server/app/core/integrity.py .github/workflows/sentinel-auto-patch.yml
          git commit -m "fix: wire verifier and auth lockout without dropping endpoints"
          git push origin HEAD:${TARGET_BRANCH}
