name: Modernization Lockfile Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  web-lockfile:
    if: github.head_ref == 'chore/platform-dependency-modernization'
    name: Resolve and apply modern Web lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Resolve package lock without lifecycle scripts
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Validate lock/package agreement
        working-directory: web
        run: npm ci --ignore-scripts --no-audit
      - name: Apply lockfile only to modernization branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "chore/platform-dependency-modernization"
          cp web/package-lock.json "$RUNNER_TEMP/package-lock.json"
          git fetch origin "$GITHUB_HEAD_REF"
          git reset --hard "origin/$GITHUB_HEAD_REF"
          cp "$RUNNER_TEMP/package-lock.json" web/package-lock.json
          if git diff --quiet -- web/package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "build(web): refresh deterministic npm lockfile"
          git push origin "HEAD:$GITHUB_HEAD_REF"
