name: H Design Preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'design/h-system/**'
      - '.github/workflows/h-design-preview.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  preview:
    name: Design prototype interaction and routes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node --test design/h-system/tests/*.test.mjs
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Check direct routes and interaction journeys
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/web/node_modules/@playwright/test
          H_QA_OUTPUT: ${{ runner.temp }}/sentinel-h-qa
        run: node design/h-system/tests/browser.cjs
      - name: Upload exact-source prototype and QA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinel-h-design-${{ github.event.pull_request.head.sha }}
          path: |
            design/h-system/
            ${{ runner.temp }}/sentinel-h-qa/
          if-no-files-found: error
          retention-days: 30
