[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-core"
version = "1.0.0rc2"
description = "SENTINEL CORE security-first modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "websockets==17.1",
  "pydantic==2.13.5",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "postgres: requires a live PostgreSQL database",
]
