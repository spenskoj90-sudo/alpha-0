name: Staging MFA Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-mfa-acceptance
  cancel-in-progress: false

jobs:
  staging-mfa-e2e:
    name: Staging account MFA lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SENTINEL_STAGING_BASE_URL: https://sentinel-core-staging.onrender.com
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install cryptography
        run: python -m pip install --disable-pip-version-check cryptography==50.0.1

      - name: Exercise real staging MFA lifecycle
        run: python scripts/staging_mfa_acceptance.py
