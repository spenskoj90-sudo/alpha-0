name: Sync CURRENT_STATE HEAD

on:
  push:
    branches: [main]

# Minimal permissions: only write to contents for the bot commit.
permissions:
  contents: write

jobs:
  sync-head:
    name: Update Canonical HEAD
    runs-on: ubuntu-latest
    # Prevent re-entrancy: do not run on the auto-sync commit itself.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch Canonical HEAD line
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os, re, sys
          path = "docs/SENTINEL_CURRENT_STATE.md"
          sha = os.environ["TARGET_SHA"]
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          pattern = r"(\*\*Canonical HEAD \(main\):\*\* `)[0-9a-f]{7,40}(`)"
          new_text, n = re.subn(pattern, r"\g<1>" + sha + r"\g<2>", text, count=1)
          if n != 1:
              print(f"ERROR: expected exactly 1 Canonical HEAD match, got {n}")
              sys.exit(1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(new_text)
          print(f"Patched Canonical HEAD to {sha}")
          PY

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SENTINEL_CURRENT_STATE.md
          if git diff --staged --quiet; then
            echo "No change: Canonical HEAD already matches ${{ github.sha }}"
          else
            git commit -m "chore: auto-sync CURRENT_STATE HEAD [skip ci]"
            git push
            echo "Pushed auto-sync commit"
          fi
