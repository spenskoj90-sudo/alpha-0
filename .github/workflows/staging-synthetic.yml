name: Staging Synthetic Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-synthetic-main
  cancel-in-progress: true

jobs:
  staging-synthetic:
    name: Exact-SHA staging synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Run exact-SHA staging synthetic
        env:
          SENTINEL_SOURCE_SHA: ${{ github.sha }}
          SENTINEL_PROBE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python scripts/staging_surface_smoke.py \
            --expected-sha "$SENTINEL_SOURCE_SHA" \
            --expected-version "$(cat VERSION)" \
            --probe-id "$SENTINEL_PROBE_ID"
      - name: Upload staging synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-staging-synthetic-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/staging-synthetic.json
          if-no-files-found: error
          retention-days: 30

  staging-browser:
    name: Exact-SHA staging browser acceptance
    needs: [staging-synthetic]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Exercise staging product with disposable identities
        run: npm run test:browser
        working-directory: web
        env:
          SENTINEL_BROWSER_TARGET: staging
      - name: Upload browser summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-staging-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: web/test-results/browser-results.json
          if-no-files-found: error
          retention-days: 30
