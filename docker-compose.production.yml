services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sentinel]

  core:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SENTINEL_ENV: production
      DATABASE_URL: postgresql+psycopg://sentinel:${DB_PASSWORD}@postgres:5432/sentinel
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [sentinel]

volumes:
  postgres_data:

networks:
  sentinel:
    driver: bridge
