name: Security

on:
  push:
    branches: [main, sentinel-1.0.0-rc1-final]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: server
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
          pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: web
        run: npm install
      - working-directory: web
        run: npm audit --audit-level=high

  filesystem:
    name: Secret and image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,})' . --exclude-dir=.git --exclude='*.md'; then
            echo "Potential credential material detected"
            exit 1
          fi
