name: Generate Web Coverage Lockfile

on:
  push:
    branches:
      - gpt/final-rc-consolidation-2026-09-25
    paths:
      - ".github/workflows/web-coverage-lock-temp.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Generate Web coverage lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate deterministic package metadata
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --save-dev @vitest/coverage-v8@5.0.1
      - name: Upload generated package metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-coverage-lock-${{ github.sha }}
          path: |
            web/package.json
            web/package-lock.json
          if-no-files-found: error
          retention-days: 1
