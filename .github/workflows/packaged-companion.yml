name: Packaged Companion Host

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-companion:
    name: Packaged Companion host evidence
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SENTINEL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Run launcher regression tests
        working-directory: launcher
        shell: pwsh
        run: npm test

      - name: Build unsigned package A
        shell: pwsh
        run: |
          ./launcher/scripts/package-windows.ps1 `
            -OutputDir "$env:RUNNER_TEMP\sentinel-package-a" `
            -EvidenceDir "$env:RUNNER_TEMP\sentinel-evidence-a" `
            -CacheDir "$env:RUNNER_TEMP\sentinel-electron-cache"

      - name: Build unsigned package B independently
        shell: pwsh
        run: |
          ./launcher/scripts/package-windows.ps1 `
            -OutputDir "$env:RUNNER_TEMP\sentinel-package-b" `
            -EvidenceDir "$env:RUNNER_TEMP\sentinel-evidence-b" `
            -CacheDir "$env:RUNNER_TEMP\sentinel-electron-cache"

      - name: Verify exact-SHA provenance and reproducible filesystem
        shell: pwsh
        run: |
          $evidenceA = Get-Content -Raw "$env:RUNNER_TEMP\sentinel-evidence-a\build-evidence.json" | ConvertFrom-Json
          $evidenceB = Get-Content -Raw "$env:RUNNER_TEMP\sentinel-evidence-b\build-evidence.json" | ConvertFrom-Json
          if ($evidenceA.status -ne "pass" -or $evidenceB.status -ne "pass") {
            throw "packaging evidence is not PASS"
          }
          if ($evidenceA.sourceSha -ne $env:SENTINEL_SOURCE_SHA -or $evidenceB.sourceSha -ne $env:SENTINEL_SOURCE_SHA) {
            throw "packaging evidence is not bound to exact source SHA $env:SENTINEL_SOURCE_SHA"
          }
          if ($evidenceA.signed -ne $false -or $evidenceB.signed -ne $false) {
            throw "ordinary CI package must remain unsigned"
          }
          $manifestA = Get-Content -Raw "$env:RUNNER_TEMP\sentinel-evidence-a\package-manifest.sha256"
          $manifestB = Get-Content -Raw "$env:RUNNER_TEMP\sentinel-evidence-b\package-manifest.sha256"
          if ($manifestA -cne $manifestB) {
            Compare-Object `
              (Get-Content "$env:RUNNER_TEMP\sentinel-evidence-a\package-manifest.sha256") `
              (Get-Content "$env:RUNNER_TEMP\sentinel-evidence-b\package-manifest.sha256")
            throw "independent packaged filesystems are not reproducible"
          }
          Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\sentinel-evidence-a\package-manifest.sha256"

      - name: Run packaged Electron runtime smoke
        shell: pwsh
        run: |
          $smokeEvidence = "$env:RUNNER_TEMP\sentinel-evidence-a\smoke-evidence.json"
          $companionExe = "$env:RUNNER_TEMP\sentinel-package-a\SENTINEL Companion.exe"
          $env:SENTINEL_PACKAGE_SMOKE_OUTPUT = $smokeEvidence
          $env:SENTINEL_PACKAGED_HOST_SMOKE = "1"
          $process = Start-Process `
            -FilePath $companionExe `
            -ArgumentList @("--disable-gpu") `
            -PassThru `
            -Wait
          if ($process.ExitCode -ne 0) {
            throw "packaged Electron runtime smoke exited with $($process.ExitCode)"
          }
          if (-not (Test-Path $smokeEvidence -PathType Leaf)) {
            throw "packaged Electron runtime did not emit smoke evidence"
          }
          $smoke = Get-Content -Raw $smokeEvidence | ConvertFrom-Json
          if ($smoke.status -ne "pass") {
            throw "packaged runtime smoke did not pass"
          }
          if ($smoke.sourceSha -ne $env:SENTINEL_SOURCE_SHA) {
            throw "runtime smoke evidence is not bound to exact source SHA $env:SENTINEL_SOURCE_SHA"
          }
          if ($smoke.electronVersion -ne "44.4.5") {
            throw "unexpected packaged Electron version $($smoke.electronVersion)"
          }
          if ($smoke.main -ne "bootstrap.js") {
            throw "packaged runtime did not boot through bootstrap.js"
          }
          if ($smoke.signed -ne $false) {
            throw "ordinary CI runtime evidence must remain unsigned"
          }
          $smoke | ConvertTo-Json -Depth 6

      - name: Archive deterministic package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "$env:RUNNER_TEMP\sentinel-package-a\*" `
            -DestinationPath "$env:RUNNER_TEMP\sentinel-companion-win32-x64.zip" `
            -CompressionLevel Optimal
          $archiveSha = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\sentinel-companion-win32-x64.zip").Hash.ToLowerInvariant()
          Set-Content -Encoding utf8 "$env:RUNNER_TEMP\sentinel-evidence-a\archive-sha256.txt" $archiveSha

      - name: Stage immutable packaged evidence
        shell: pwsh
        run: |
          $stage = "artifacts\packaged-companion"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$env:RUNNER_TEMP\sentinel-companion-win32-x64.zip" "$stage\sentinel-companion-win32-x64.zip"
          Copy-Item "$env:RUNNER_TEMP\sentinel-evidence-a\build-evidence.json" "$stage\build-evidence.json"
          Copy-Item "$env:RUNNER_TEMP\sentinel-evidence-a\package-manifest.sha256" "$stage\package-manifest.sha256"
          Copy-Item "$env:RUNNER_TEMP\sentinel-evidence-a\smoke-evidence.json" "$stage\smoke-evidence.json"
          Copy-Item "$env:RUNNER_TEMP\sentinel-evidence-a\archive-sha256.txt" "$stage\archive-sha256.txt"

      - name: Upload exact-SHA packaged Companion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-companion-host-${{ env.SENTINEL_SOURCE_SHA }}
          path: artifacts/packaged-companion/
          if-no-files-found: error
          retention-days: 90

  attest-packaged-companion:
    name: Attest protected-main packaged Companion evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: packaged-companion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SENTINEL_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Download verified packaged Companion evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-companion-host-${{ env.SENTINEL_SOURCE_SHA }}
          path: attestation-input

      - name: Require canonical packaged subjects
        run: |
          set -euo pipefail
          test -s attestation-input/sentinel-companion-win32-x64.zip
          test -s attestation-input/build-evidence.json
          test -s attestation-input/package-manifest.sha256
          test -s attestation-input/smoke-evidence.json
          test -s attestation-input/archive-sha256.txt
          expected="$(tr -d '[:space:]' < attestation-input/archive-sha256.txt)"
          actual="$(sha256sum attestation-input/sentinel-companion-win32-x64.zip | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Attest exact protected-main packaged Companion evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            attestation-input/sentinel-companion-win32-x64.zip
            attestation-input/build-evidence.json
            attestation-input/package-manifest.sha256
            attestation-input/smoke-evidence.json
            attestation-input/archive-sha256.txt
