[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-core"
version = "1.0.0rc2"
description = "SENTINEL CORE security-first modular monolith"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "uvicorn[standard]>=0.53,<1.0",
  "websockets>=17.1,<18",
  "pydantic>=2.13.5,<3.0",
  "sqlalchemy>=2.0.54,<2.1",
  "psycopg[binary]>=3.3.6,<4.0",
  "cryptography>=50.0.1,<51",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1,<10.0",
  "httpx>=0.28.1,<1.0",
  "pytest-cov>=7.1,<8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "postgres: requires a live PostgreSQL database",
]
