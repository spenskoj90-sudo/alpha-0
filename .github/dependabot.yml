version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    labels: ["dependencies", "ci"]
    groups:
      codeql-actions:
        patterns: ["github/codeql-action/*"]

  - package-ecosystem: "npm"
    directories: ["/web", "/site"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    labels: ["dependencies", "web"]
    groups:
      vitest-tooling:
        patterns: ["vitest", "@vitest/*"]

  - package-ecosystem: "npm"
    directory: "/launcher"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    labels: ["dependencies", "companion"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    labels: ["dependencies", "android"]

  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 6
    labels: ["dependencies", "server"]
