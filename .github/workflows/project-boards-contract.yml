name: Portfolio Project Bootstrap Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/bootstrap_project_boards_v21.sh"
      - "scripts/test_project_boards_v21.py"
      - ".github/workflows/project-boards-contract.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Project bootstrap simulation (no credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify gh bootstrap under mocked GitHub CLI
        run: |
          set -euo pipefail
          jq --version
          python3 scripts/test_project_boards_v21.py
