name: P1 Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p1-evidence:
    name: P1 evidence artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install server and audit tooling
        working-directory: server
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install '.[test]'

      - name: Generate Python SCA report
        working-directory: server
        run: |
          mkdir -p ../artifacts
          set +e
          pip-audit --format json --output ../artifacts/pip-audit.json
          rc=$?
          set -e
          cat ../artifacts/pip-audit.json
          exit $rc

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate web SCA report
        working-directory: web
        run: |
          npm ci
          mkdir -p ../artifacts
          set +e
          npm audit --json > ../artifacts/npm-audit.json
          rc=$?
          set -e
          cat ../artifacts/npm-audit.json
          exit $rc

      - name: Generate Gradle dependency report
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > artifacts/gradle-dependencies.txt

      - name: Run P1 unit/performance evidence
        working-directory: server
        run: |
          pytest -q tests/test_p1_runtime.py tests/test_performance.py | tee ../artifacts/p1-performance.txt

      - name: Upload P1 evidence artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-p1-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
