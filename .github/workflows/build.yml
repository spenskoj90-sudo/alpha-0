name: Build & Test

on:
  push:
    branches: [main, sentinel-1.0.0-rc1-final]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash verify.sh

  core:
    name: Core tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m compileall -q app migrate.py
      - run: pytest -m 'not postgres' --cov=app --cov-report=term-missing --cov-fail-under=80

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://sentinel:testpass@127.0.0.1:5432/sentinel_test
      SENTINEL_ENV: production
      SENTINEL_ENROLLMENT_TOKEN: pg-smoke:secret
      SENTINEL_REQUIRE_ENROLLMENT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python migrate.py
      - run: pytest -m postgres

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug
      - run: ./gradlew --no-daemon test

  android-instrumentation:
    name: Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: [core, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: sentinel-core:ci
