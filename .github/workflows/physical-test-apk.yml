name: Physical Test APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHYSICAL_TEST_API_BASE_URL: https://sentinel-core-staging.onrender.com
  PHYSICAL_TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  physical-test-apk:
    name: Build physical test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Establish monotonic physical-test version code
        shell: bash
        run: |
          set -euo pipefail
          value=$((100000000 + GITHUB_RUN_NUMBER))
          echo "SENTINEL_PHYSICAL_TEST_VERSION_CODE=$value" >> "$GITHUB_ENV"

      - name: Mark diagnostic signing mode
        run: echo "SENTINEL_PHYSICAL_TEST_SIGNING_MODE=ephemeral-debug" >> "$GITHUB_ENV"

      - name: Run Android unit tests across configured variants
        env:
          SENTINEL_API_BASE_URL: ${{ env.PHYSICAL_TEST_API_BASE_URL }}
          SENTINEL_SOURCE_SHA: ${{ env.PHYSICAL_TEST_SOURCE_SHA }}
          SENTINEL_RUNTIME_ENVIRONMENT: staging
        run: ./gradlew --no-daemon test

      - name: Build isolated physical-test APK against staging Core
        env:
          SENTINEL_API_BASE_URL: ${{ env.PHYSICAL_TEST_API_BASE_URL }}
          SENTINEL_SOURCE_SHA: ${{ env.PHYSICAL_TEST_SOURCE_SHA }}
          SENTINEL_RUNTIME_ENVIRONMENT: staging
        run: ./gradlew --no-daemon assemblePhysicalTest

      - name: Verify diagnostic signer and hash APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/physicalTest/app-physicalTest.apk > physical-test-signer.txt
          signer_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' physical-test-signer.txt | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')"
          case "$signer_sha256" in
            *[!0-9a-f]*|'') echo "invalid signer certificate SHA-256"; exit 1 ;;
          esac
          test "${#signer_sha256}" -eq 64
          echo "SENTINEL_PHYSICAL_TEST_SIGNER_SHA256=$signer_sha256" >> "$GITHUB_ENV"
          sha256sum app/build/outputs/apk/physicalTest/app-physicalTest.apk | tee physical-test-apk.sha256

      - name: Verify compiled APK identity, staging binding, signer identity, and production separation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/physical_test_artifact.py \
            --apk app/build/outputs/apk/physicalTest/app-physicalTest.apk \
            --output-metadata app/build/outputs/apk/physicalTest/output-metadata.json \
            --version-file VERSION \
            --source-sha "$PHYSICAL_TEST_SOURCE_SHA" \
            --api-base-url "$PHYSICAL_TEST_API_BASE_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --signer-sha256 "$SENTINEL_PHYSICAL_TEST_SIGNER_SHA256" \
            --signing-mode "$SENTINEL_PHYSICAL_TEST_SIGNING_MODE" \
            --output physical-test-manifest.json

      - name: Verify physical-test APK hash binding
        run: |
          test "$(cut -d ' ' -f 1 physical-test-apk.sha256)" = "$(python -c 'import json; print(json.load(open("physical-test-manifest.json"))["apk"]["sha256"])')"
          test "$(python -c 'import json; print(json.load(open("physical-test-manifest.json"))["signerCertificateSha256"])')" = "$SENTINEL_PHYSICAL_TEST_SIGNER_SHA256"

      - name: Upload exact-SHA physical-test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-physical-test-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/physicalTest/app-physicalTest.apk
            physical-test-apk.sha256
            physical-test-manifest.json
            physical-test-signer.txt
          if-no-files-found: error
          retention-days: 90
