name: ALPHA-0 Android CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Prepare signing keystore
        env:
          ALPHA0_KEYSTORE_BASE64: ${{ secrets.ALPHA0_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$ALPHA0_KEYSTORE_BASE64"

          mkdir -p "$RUNNER_TEMP/alpha0"

          echo "$ALPHA0_KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/alpha0/alpha0-release.keystore"

          test -s "$RUNNER_TEMP/alpha0/alpha0-release.keystore"

      - name: Build Debug APK
        env:
          ALPHA0_KEYSTORE_PATH: ${{ runner.temp }}/alpha0/alpha0-release.keystore
          ALPHA0_KEYSTORE_PASSWORD: ${{ secrets.ALPHA0_KEYSTORE_PASSWORD }}
          ALPHA0_KEY_ALIAS: ${{ secrets.ALPHA0_KEY_ALIAS }}
          ALPHA0_KEY_PASSWORD: ${{ secrets.ALPHA0_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Run Unit Tests
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace test

      - name: Verify APK exists
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: alpha-0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/alpha0"
