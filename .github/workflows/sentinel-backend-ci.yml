name: SENTINEL Backend CI

on:
  push:
    branches: ["main", "sentinel/full-stack-builder"]
    paths:
      - "backend/**"
      - ".github/workflows/sentinel-backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/sentinel-backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q sentinel_core tests
      - name: Unit and security tests
        run: pytest -q
