name: SENTINEL CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-version: "8.9"

      - name: Generate pinned Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build supported JVM and Android compile targets for CodeQL
        run: |
          ./gradlew --no-daemon --stacktrace clean \
            :core:compileKotlin \
            :server:compileKotlin \
            :app:compileDebugKotlin \
            :app:compileReleaseKotlin

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:java-kotlin"
