name: Android APK In-Place Update Retention

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/android_update_emulator.sh"
      - ".github/workflows/android-update-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-retention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulator-upgrade:
    name: Same-signer APK upgrade preserves app data (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SENTINEL_API_BASE_URL: https://sentinel-core-staging.onrender.com
      SENTINEL_API_FALLBACK_BASE_URL: https://sentinel-web-staging-fxhn.onrender.com/api/mobile-core
      SENTINEL_RUNTIME_ENVIRONMENT: staging
      SENTINEL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SENTINEL_UPGRADE_RETENTION_E2E: "true"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Verify apksigner output parser
        run: python -m unittest discover -s scripts -p "test_apk_signer_certificate.py" -v
      - name: Build two same-signer diagnostic versions
        run: bash scripts/android_update_emulator.sh build
      - name: Enable KVM
        run: |
          sudo groupadd -f kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android upgrade and data retention
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/android_update_emulator.sh verify
