name: Release Candidate Artifact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact protected-main commit SHA to sign"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  attestations: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

env:
  SENTINEL_RELEASE_SIGNER_SHA256: "2A:CD:1C:FF:F4:F3:4D:B1:25:0D:3F:6C:81:F0:88:74:93:C4:60:2D:3C:FA:65:31:09:93:C0:58:08:9D:B8:8E"

jobs:
  presecret:
    name: Verify exact-SHA release evidence before signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      binding_digest: ${{ steps.binding.outputs.digest }}
    steps:
      - name: Require dispatch from exact protected-main source
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo "source_sha must be lowercase hexadecimal"; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          test "$GITHUB_SHA" = "$SOURCE_SHA"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}

      - name: Checkout selected source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run release-lineage contract tests
        run: |
          python scripts/test_release_evidence.py
          python scripts/test_release_evidence_supply_chain.py
          python scripts/test_release_lineage.py
          python scripts/test_artifact_attestations.py

      - name: Verify protected-main release-evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash scripts/verify_release_evidence_attestation.sh \
            "$GITHUB_REPOSITORY" \
            "$SOURCE_SHA" \
            "$RUNNER_TEMP/release-evidence-attestation"

      - name: Verify canonical protected-main evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/release_lineage.py presecret \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SOURCE_SHA"
          bash scripts/write_release_presecret_binding.sh \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$version" release-presecret-binding.json
          python scripts/release_lineage.py verify-binding \
            --input release-presecret-binding.json \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-sha "$SOURCE_SHA" \
            --expected-version "$version"

      - name: Export deterministic binding digest
        id: binding
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open("release-presecret-binding.json", encoding="utf-8"))
          print("digest=" + value["bindingDigest"])
          PY

      - name: Upload pre-secret release binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-release-presecret-binding-${{ inputs.source_sha }}
          path: release-presecret-binding.json
          if-no-files-found: error
          retention-days: 90

  release-candidate:
    name: Build and retain verified signed release APK
    needs: presecret
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_sha256: ${{ steps.hashes.outputs.apk_sha256 }}
      candidate_sha256: ${{ steps.hashes.outputs.candidate_sha256 }}
      binding_sha256: ${{ steps.hashes.outputs.binding_sha256 }}
    steps:
      - name: Checkout exact selected source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Reconfirm protected-main release-evidence attestation before secret access
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          bash scripts/verify_release_evidence_attestation.sh \
            "$GITHUB_REPOSITORY" \
            "$SOURCE_SHA" \
            "$RUNNER_TEMP/release-evidence-attestation"

      - name: Reconfirm canonical evidence before secret access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_BINDING_DIGEST: ${{ needs.presecret.outputs.binding_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/release_lineage.py presecret \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SOURCE_SHA"
          bash scripts/write_release_presecret_binding.sh \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$version" release-presecret-binding.json
          python scripts/release_lineage.py verify-binding \
            --input release-presecret-binding.json \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-sha "$SOURCE_SHA" \
            --expected-version "$version"
          actual="$(python -c 'import json; print(json.load(open("release-presecret-binding.json", encoding="utf-8"))["bindingDigest"])')"
          test "$actual" = "$EXPECTED_BINDING_DIGEST"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          test -n "${ANDROID_KEYSTORE_BASE64}"
          python - <<'PY'
          import base64, os, pathlib
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          compact = "".join(raw.split())
          padded = compact + ("=" * (-len(compact) % 4))
          data = base64.b64decode(padded, validate=True)
          if not data:
              raise SystemExit("decoded keystore is empty")
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "sentinel-release.jks")
          path.write_bytes(data)
          PY
          chmod 600 "$RUNNER_TEMP/sentinel-release.jks"

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sentinel-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify release APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          if find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "Unexpected debug APK present — FAIL"
            exit 1
          fi
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          expected_norm="$(printf '%s' "$SENTINEL_RELEASE_SIGNER_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          actual_norm="$(printf '%s' "$actual" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual_norm" = "$expected_norm"
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)"
          test -x "$aapt"
          dump="$("$aapt" dump badging "$apk")"
          if echo "$dump" | grep -qi "application-debuggable"; then
            echo "APK is debuggable — FAIL"
            exit 1
          fi
          echo "Verified release APK: $apk"

      - name: Build release-candidate lineage package
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p release-candidate-package
          cp app/build/outputs/apk/release/app-release.apk release-candidate-package/app-release.apk
          cp release-presecret-binding.json release-candidate-package/release-presecret-binding.json
          python scripts/release_lineage.py create-candidate \
            --binding release-presecret-binding.json \
            --apk release-candidate-package/app-release.apk \
            --signer-sha256 "$SENTINEL_RELEASE_SIGNER_SHA256" \
            --output release-candidate-package/release-candidate.json
          python scripts/release_lineage.py verify-candidate \
            --input release-candidate-package/release-candidate.json \
            --binding release-presecret-binding.json \
            --apk release-candidate-package/app-release.apk \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-sha "$SOURCE_SHA" \
            --expected-version "$version" \
            --expected-signer-sha256 "$SENTINEL_RELEASE_SIGNER_SHA256"

      - name: Export signed candidate hashes
        id: hashes
        run: |
          set -euo pipefail
          echo "apk_sha256=$(sha256sum release-candidate-package/app-release.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum release-candidate-package/release-candidate.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "binding_sha256=$(sha256sum release-candidate-package/release-presecret-binding.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload verified signed release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-release-candidate-${{ inputs.source_sha }}
          path: release-candidate-package/*
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sentinel-release.jks"

  attest-release-candidate:
    name: Attest verified signed release candidate
    needs: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Download verified signed release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sentinel-release-candidate-${{ env.SOURCE_SHA }}
          path: attestation-input

      - name: Recheck candidate bytes before attestation
        env:
          EXPECTED_APK_SHA256: ${{ needs.release-candidate.outputs.apk_sha256 }}
          EXPECTED_CANDIDATE_SHA256: ${{ needs.release-candidate.outputs.candidate_sha256 }}
          EXPECTED_BINDING_SHA256: ${{ needs.release-candidate.outputs.binding_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum attestation-input/app-release.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "$(sha256sum attestation-input/release-candidate.json | awk '{print $1}')" = "$EXPECTED_CANDIDATE_SHA256"
          test "$(sha256sum attestation-input/release-presecret-binding.json | awk '{print $1}')" = "$EXPECTED_BINDING_SHA256"

      - name: Attest exact signed release candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            attestation-input/app-release.apk
            attestation-input/release-candidate.json
            attestation-input/release-presecret-binding.json
