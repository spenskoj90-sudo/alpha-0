name: Branch Hygiene

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/branch-hygiene.yml"
      - "docs/BRANCH_INVENTORY.md"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sentinel-branch-hygiene
  cancel-in-progress: false

jobs:
  delete-proven-legacy-branches:
    name: Delete proven legacy branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Delete only live-revalidated reconciled branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          inventory="docs/BRANCH_INVENTORY.md"
          test -f "$inventory"

          python - <<'PY' > "$RUNNER_TEMP/branch-hygiene.tsv"
          import re
          from pathlib import Path

          row = re.compile(
              r"^\| `(?P<branch>[^`]+)` \| `(?P<tip>[0-9a-f]{40})` \| "
              r"(?P<class>[A-Z_]+) \| (?P<reason>.*) \|$"
          )
          pr_number = re.compile(r"PR #(\d+) merged")
          allowed = {"MERGED_EXACT", "PURE_BEHIND", "CONTENT_SUPERSEDED"}
          for line in Path("docs/BRANCH_INVENTORY.md").read_text(encoding="utf-8").splitlines():
              match = row.match(line)
              if not match:
                  continue
              classification = match.group("class")
              if classification == "ACTIVE":
                  continue
              if classification not in allowed:
                  raise SystemExit(
                      f"inventory contains non-deletable classification {classification}: "
                      f"{match.group('branch')}"
                  )
              branch = match.group("branch")
              reason = match.group("reason")
              if branch == "main" or any(ch.isspace() for ch in branch):
                  raise SystemExit(f"unsafe branch name in inventory: {branch!r}")
              pr = ""
              if classification == "MERGED_EXACT":
                  pr_match = pr_number.search(reason)
                  if not pr_match or "live tip equals exact PR head" not in reason:
                      raise SystemExit(f"MERGED_EXACT row lacks exact-PR evidence: {branch}")
                  pr = pr_match.group(1)
              elif classification == "CONTENT_SUPERSEDED":
                  if not reason.startswith("RECONCILED:"):
                      raise SystemExit(f"CONTENT_SUPERSEDED row lacks reconciliation evidence: {branch}")
              print("\t".join((branch, match.group("tip"), classification, pr)))
          PY

          delete_exact_ref() {
            local branch="$1"
            local expected_sha="$2"
            local encoded protected remote_sha
            git check-ref-format --branch "$branch" >/dev/null
            remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$remote_sha" ]; then
              echo "already absent: $branch"
              return 2
            fi
            if [ "$remote_sha" != "$expected_sha" ]; then
              echo "ref mutation detected for $branch: expected $expected_sha, live $remote_sha" >&2
              exit 1
            fi
            encoded="$(python - "$branch" <<'PY'
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=""))
          PY
          )"
            protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/$encoded" --jq '.protected')"
            if [ "$protected" != "false" ]; then
              echo "refusing to delete protected branch: $branch" >&2
              exit 1
            fi
            git fetch --no-tags origin "refs/heads/$branch"
            fetched_sha="$(git rev-parse FETCH_HEAD)"
            if [ "$fetched_sha" != "$expected_sha" ]; then
              echo "fetched ref mutation detected for $branch: expected $expected_sha, fetched $fetched_sha" >&2
              exit 1
            fi
            git cat-file -e "$fetched_sha^{commit}"
            git push origin --delete "$branch"
            return 0
          }

          deleted=0
          skipped_absent=0
          while IFS=$'\t' read -r branch expected_sha classification pr_number; do
            remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$remote_sha" ]; then
              echo "already absent: $branch"
              skipped_absent=$((skipped_absent + 1))
              continue
            fi
            if [ "$remote_sha" != "$expected_sha" ]; then
              echo "ref mutation detected for $branch: expected $expected_sha, live $remote_sha" >&2
              exit 1
            fi

            case "$classification" in
              MERGED_EXACT)
                pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
                live_head="$(jq -r '.head.sha' <<<"$pr_json")"
                merged_at="$(jq -r '.merged_at // ""' <<<"$pr_json")"
                base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
                head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
                test -n "$merged_at"
                test "$base_ref" = "main"
                test "$head_repo" = "$GITHUB_REPOSITORY"
                if [ "$live_head" != "$remote_sha" ]; then
                  echo "exact PR-head mismatch for $branch: PR #$pr_number=$live_head branch=$remote_sha" >&2
                  exit 1
                fi
                ;;
              PURE_BEHIND)
                if ! git merge-base --is-ancestor "$remote_sha" "$GITHUB_SHA"; then
                  echo "PURE_BEHIND ancestry failed for $branch at $remote_sha" >&2
                  exit 1
                fi
                ;;
              CONTENT_SUPERSEDED)
                # Semantic reconciliation is recorded and reviewed in the exact-main
                # inventory. At execution time the destructive boundary re-proves
                # that the reviewed ref itself has not mutated.
                ;;
              *)
                echo "unexpected cleanup classification: $classification" >&2
                exit 1
                ;;
            esac

            if delete_exact_ref "$branch" "$expected_sha"; then
              deleted=$((deleted + 1))
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                skipped_absent=$((skipped_absent + 1))
              else
                exit "$rc"
              fi
            fi
          done < "$RUNNER_TEMP/branch-hygiene.tsv"

          # Delete the branch that produced this merge commit as well, but only
          # after GitHub independently proves exact same-repository PR lineage.
          merge_pr="$(git show -s --format=%s "$GITHUB_SHA" | sed -nE 's/^Merge PR #([0-9]+):.*$/\1/p')"
          if [ -n "$merge_pr" ]; then
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$merge_pr")"
            merged_at="$(jq -r '.merged_at // ""' <<<"$pr_json")"
            merge_sha="$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            if [ -n "$merged_at" ] && [ "$merge_sha" = "$GITHUB_SHA" ] &&
               [ "$base_ref" = "main" ] && [ "$head_repo" = "$GITHUB_REPOSITORY" ] &&
               [ "$head_ref" != "main" ]; then
              if delete_exact_ref "$head_ref" "$head_sha"; then
                deleted=$((deleted + 1))
              else
                rc=$?
                if [ "$rc" -eq 2 ]; then
                  skipped_absent=$((skipped_absent + 1))
                else
                  exit "$rc"
                fi
              fi
            else
              echo "current merge PR lineage did not satisfy self-cleanup gate; preserving head branch"
            fi
          fi

          echo "BRANCH_HYGIENE deleted=$deleted already_absent=$skipped_absent"
