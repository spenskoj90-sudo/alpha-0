<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SENTINEL Overlay</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;pointer-events:none;color:#eef4f7}
    #overlay-root{display:flex;flex-direction:column;gap:10px;padding:12px;box-sizing:border-box;align-items:stretch}
    .overlay-card{background:rgba(7,10,13,.93);border:1px solid rgba(119,145,164,.42);border-radius:14px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.36);backdrop-filter:blur(6px)}
    .overlay-header{font-size:11px;font-weight:800;letter-spacing:.14em;color:#9acb52;margin-bottom:7px}
    .kind-alert .overlay-header{color:#ff9c78}.kind-status .overlay-header{color:#8cb8d9}
    .overlay-text{font-size:14px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
    .overlay-meta{margin-top:8px;font-size:10px;letter-spacing:.08em;color:#8996a3}
  </style>
</head>
<body>
  <main id="overlay-root" aria-live="polite" aria-atomic="false"></main>
  <script src="overlay-renderer.js"></script>
</body>
</html>
