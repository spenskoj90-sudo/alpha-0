[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-core"
version = "1.0.0rc1"
description = "SENTINEL CORE security-first modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10.0",
  "httpx>=0.28,<1.0",
  "pytest-cov>=6.2,<7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "postgres: requires a live PostgreSQL database",
]
