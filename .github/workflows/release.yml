name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SENTINEL_RELEASE_SIGNER_SHA256: "2A:CD:1C:FF:F4:F3:4D:B1:25:0D:3F:6C:81:F0:88:74:93:C4:60:2D:3C:FA:65:31:09:93:C0:58:08:9D:B8:8E"

jobs:
  presecret:
    name: Verify exact-SHA release evidence before publication authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      binding_digest: ${{ steps.binding.outputs.digest }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve exact source SHA and verify release tag version
        id: identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          case "$source_sha" in
            *[!0-9a-f]*|'') echo "resolved source SHA is invalid"; exit 1 ;;
          esac
          test "${#source_sha}" -eq 40
          expected="$(tr '[:upper:]' '[:lower:]' < VERSION | tr -d '[:space:]')"
          actual="$(printf '%s' "${GITHUB_REF_NAME#v}" | tr '[:upper:]' '[:lower:]')"
          if [ "$actual" != "$expected" ]; then
            echo "Release tag version '$actual' does not match VERSION '$expected'."
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run release-lineage contract tests
        run: |
          python scripts/test_release_evidence.py
          python scripts/test_release_evidence_supply_chain.py
          python scripts/test_release_lineage.py

      - name: Verify canonical protected-main evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/release_lineage.py presecret \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SOURCE_SHA" \
            --output release-presecret-binding.json
          version="$(tr -d '[:space:]' < VERSION)"
          python scripts/release_lineage.py verify-binding \
            --input release-presecret-binding.json \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-sha "$SOURCE_SHA" \
            --expected-version "$version"

      - name: Export deterministic binding digest
        id: binding
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open("release-presecret-binding.json", encoding="utf-8"))
          print("digest=" + value["bindingDigest"])
          PY

      - name: Upload publication pre-secret binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-release-publication-binding-${{ steps.identity.outputs.source_sha }}
          path: release-presecret-binding.json
          if-no-files-found: error
          retention-days: 90

  verify-candidate:
    name: Verify signed candidate before publication authority
    needs: presecret
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      apk_sha256: ${{ steps.hashes.outputs.apk_sha256 }}
      core_sha256: ${{ steps.hashes.outputs.core_sha256 }}
      candidate_sha256: ${{ steps.hashes.outputs.candidate_sha256 }}
      provenance_sha256: ${{ steps.hashes.outputs.provenance_sha256 }}
      binding_sha256: ${{ steps.hashes.outputs.binding_sha256 }}
    steps:
      - name: Checkout exact release source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.presecret.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Reconfirm canonical evidence before candidate verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.presecret.outputs.source_sha }}
          EXPECTED_BINDING_DIGEST: ${{ needs.presecret.outputs.binding_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python scripts/release_lineage.py presecret \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SOURCE_SHA" \
            --output release-presecret-binding.json
          actual="$(python -c 'import json; print(json.load(open("release-presecret-binding.json", encoding="utf-8"))["bindingDigest"])')"
          test "$actual" = "$EXPECTED_BINDING_DIGEST"

      - name: Fetch and verify Owner-signed release candidate lineage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.presecret.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/release_lineage.py fetch-candidate \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$SOURCE_SHA" \
            --binding release-presecret-binding.json \
            --expected-signer-sha256 "$SENTINEL_RELEASE_SIGNER_SHA256" \
            --output-dir release-input

      - name: Verify signed release APK independently
        run: |
          set -euo pipefail
          apk="release-input/app-release.apk"
          test -f "$apk"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          expected_norm="$(printf '%s' "$SENTINEL_RELEASE_SIGNER_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          actual_norm="$(printf '%s' "$actual" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual_norm" = "$expected_norm"
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)"
          test -x "$aapt"
          dump="$("$aapt" dump badging "$apk")"
          if echo "$dump" | grep -qi "application-debuggable"; then
            echo "APK is debuggable — FAIL"
            exit 1
          fi
          echo "Release APK verification: PASS"

      - name: Build exact-source Core artifact
        run: tar -czf release-input/sentinel-core-${GITHUB_REF_NAME}.tar.gz server docs docker-compose.yml

      - name: Capture publication input hashes
        id: hashes
        run: |
          set -euo pipefail
          echo "apk_sha256=$(sha256sum release-input/app-release.apk | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "core_sha256=$(sha256sum release-input/sentinel-core-${GITHUB_REF_NAME}.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum release-input/release-candidate.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "provenance_sha256=$(sha256sum release-input/release-candidate-provenance.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "binding_sha256=$(sha256sum release-input/release-presecret-binding.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload verified publication input
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinel-release-publication-input-${{ needs.presecret.outputs.source_sha }}
          path: release-input/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish preverified release
    needs: [presecret, verify-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download preverified publication input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sentinel-release-publication-input-${{ needs.presecret.outputs.source_sha }}
          path: release-input

      - name: Recheck exact verified bytes before publication
        env:
          EXPECTED_APK_SHA256: ${{ needs.verify-candidate.outputs.apk_sha256 }}
          EXPECTED_CORE_SHA256: ${{ needs.verify-candidate.outputs.core_sha256 }}
          EXPECTED_CANDIDATE_SHA256: ${{ needs.verify-candidate.outputs.candidate_sha256 }}
          EXPECTED_PROVENANCE_SHA256: ${{ needs.verify-candidate.outputs.provenance_sha256 }}
          EXPECTED_BINDING_SHA256: ${{ needs.verify-candidate.outputs.binding_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum release-input/app-release.apk | awk '{print $1}')" = "$EXPECTED_APK_SHA256"
          test "$(sha256sum release-input/sentinel-core-${GITHUB_REF_NAME}.tar.gz | awk '{print $1}')" = "$EXPECTED_CORE_SHA256"
          test "$(sha256sum release-input/release-candidate.json | awk '{print $1}')" = "$EXPECTED_CANDIDATE_SHA256"
          test "$(sha256sum release-input/release-candidate-provenance.json | awk '{print $1}')" = "$EXPECTED_PROVENANCE_SHA256"
          test "$(sha256sum release-input/release-presecret-binding.json | awk '{print $1}')" = "$EXPECTED_BINDING_SHA256"

      - name: Publish verified release lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            release-input/app-release.apk \
            "release-input/sentinel-core-${GITHUB_REF_NAME}.tar.gz" \
            release-input/release-candidate.json \
            release-input/release-candidate-provenance.json \
            release-input/release-presecret-binding.json \
            --generate-notes \
            --title "SENTINEL ${GITHUB_REF_NAME}"
