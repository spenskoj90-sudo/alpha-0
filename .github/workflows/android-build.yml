name: SENTINEL Android CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Run Unit Tests
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace test

      - name: Run Android Lint
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace lintDebug

      - name: Verify APK and checksum
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sentinel-alpha-0-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
