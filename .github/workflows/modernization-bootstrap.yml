name: Modernization Bootstrap

on:
  push:
    branches:
      - chore/runtime-modernization-2026q3
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: modernization-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Resolve modernization inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"

      - name: Resolve Web lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate refreshed Web dependency graph
        working-directory: web
        run: |
          npm ci --no-audit
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high

      - name: Setup Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Validate Core dependency wheels on Python 3.14
        run: |
          python -m pip install --upgrade 'pip==26.2.1'
          python -m pip install './server[test]'
          cd server
          pytest -m 'not postgres'

      - name: Resolve immutable runtime image digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/modernization
          docker pull node:24.21.0-alpine3.24
          docker pull python:3.14.7-slim
          docker image inspect --format '{{index .RepoDigests 0}}' node:24.21.0-alpine3.24 > artifacts/modernization/node-image.txt
          docker image inspect --format '{{index .RepoDigests 0}}' python:3.14.7-slim > artifacts/modernization/python-image.txt
          cp web/package-lock.json artifacts/modernization/web-package-lock.json
          python --version > artifacts/modernization/python-version.txt
          node --version > artifacts/modernization/node-version.txt
          python -m pip list --format=json > artifacts/modernization/python-packages.json

      - name: Upload modernization inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modernization-inputs-${{ github.sha }}
          path: artifacts/modernization/
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated Web lockfile to same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Generated lockfile already matches repository state."
            exit 0
          fi
          git commit -m "build(web): refresh deterministic package lock"
          git push origin "HEAD:$HEAD_BRANCH"
