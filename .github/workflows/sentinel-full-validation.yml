name: SENTINEL Full Validation

on:
  push:
    branches: ["main", "sentinel/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sentinel-full-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate-a-key-management:
    name: "GATE A — Key Management"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify evidence and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/KEY_MANAGEMENT_EVIDENCE.md
          ! find . -type f \( -name '*.keystore' -o -name '*.jks' -o -name '*.p12' -o -name '*.pem' \) -not -path './.git/*' | grep -q .
          ! git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ALPHA0_KEYSTORE_PASSWORD=|DB_PASSWORD=' -- ':!*.md' ':!.github/workflows/sentinel-full-validation.yml'

  gate-bc-server:
    name: "GATE B/C/F/G/H — Core Security, Persistence, Security Regression, Reliability, Performance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install server test dependencies
        working-directory: server
        run: python -m pip install -e '.[test]'
      - name: Compile server
        working-directory: server
        run: python -m compileall -q app tests
      - name: Run server test suite
        working-directory: server
        run: python -m pytest -q
      - name: Verify migration is non-empty and PostgreSQL-oriented
        run: |
          set -euo pipefail
          test -s server/migrations/001_initial.sql
          grep -Eq 'CREATE TABLE|CREATE INDEX' server/migrations/001_initial.sql
          grep -Eq 'users|devices|sessions|entitlements|audit' server/migrations/001_initial.sql

  gate-d-android:
    name: "GATE D — Android Build + Instrumentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Run JVM unit tests
        run: gradle --no-daemon --stacktrace test
      - name: Verify RC1 version
        run: grep -q 'versionName = "1.0.0-RC1"' app/build.gradle.kts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-sentinel-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumentation tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Verify APK artifact
        run: test -s app/build/outputs/apk/debug/app-debug.apk

  gate-e-api:
    name: "GATE E — API Contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Parse OpenAPI YAML
        run: ruby -e 'require "yaml"; x=YAML.load_file("server/openapi.yaml"); abort "invalid OpenAPI" unless x["openapi"] == "3.0.3" && x["paths"].is_a?(Hash) && x["paths"].key?("/authorize")'
      - name: Verify API version consistency
        run: |
          grep -q 'version: 1.0.0-RC1' server/openapi.yaml
          grep -q 'version="1.0.0-RC1"' server/app/main.py

  gate-i-deployment:
    name: "GATE I — Deployment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate production compose
        env:
          DB_PASSWORD: validation-only-not-a-secret
        run: docker compose -f docker-compose.production.yml config >/tmp/sentinel-compose.yml
      - name: Validate Dockerfile and runtime contract
        run: |
          test -s server/Dockerfile
          grep -q 'USER sentinel' server/Dockerfile
          grep -q 'no-new-privileges' docker-compose.production.yml
          grep -q 'cap_drop' docker-compose.production.yml

  gate-j-release:
    name: "GATE J — Release Candidate"
    runs-on: ubuntu-latest
    needs: [gate-a-key-management, gate-bc-server, gate-d-android, gate-e-api, gate-i-deployment]
    steps:
      - uses: actions/checkout@v6
      - name: Verify RC1 release metadata
        run: |
          set -euo pipefail
          grep -q '1.0.0-RC1' app/build.gradle.kts
          grep -q '1.0.0rc1' server/pyproject.toml
          grep -q '1.0.0-RC1' server/openapi.yaml
          test -s docs/IMPLEMENTATION_CONTRACT_V1.md
          test -s docs/TEST_MATRIX_V1.md
      - name: Release readiness summary
        run: |
          echo 'SENTINEL 1.0.0-RC1 — automated gates A-J passed.'
          echo 'Final signed artifact creation is intentionally isolated from ordinary CI and requires the verified release keystore.'
