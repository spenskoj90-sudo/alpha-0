name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish verified release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@3a4a8e7e8e1f8b5b8c7c7c0d7a1c8b2c6e5d4f3a # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          test -n "${ANDROID_KEYSTORE_BASE64}"
          python - <<'PY'
          import base64, os, pathlib
          raw = os.environ["ANDROID_KEYSTORE_BASE64"]
          compact = "".join(raw.split())
          padded = compact + ("=" * (-len(compact) % 4))
          data = base64.b64decode(padded, validate=True)
          if not data:
              raise SystemExit("decoded keystore is empty")
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "sentinel-release.jks")
          path.write_bytes(data)
          PY
          chmod 600 "$RUNNER_TEMP/sentinel-release.jks"

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sentinel-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify release APK (signature, fingerprint, non-debuggable)
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          if find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "Unexpected debug APK present in release job workspace — FAIL"
            exit 1
          fi
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          expected="2A:CD:1C:FF:F4:F3:4D:B1:25:0D:3F:6C:81:F0:88:74:93:C4:60:2D:3C:FA:65:31:09:93:C0:58:08:9D:B8:8E"
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          expected_norm="$(printf '%s' "$expected" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          actual_norm="$(printf '%s' "$actual" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual_norm" = "$expected_norm"
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)"
          test -x "$aapt"
          dump="$("$aapt" dump badging "$apk")"
          if echo "$dump" | grep -qi "application-debuggable"; then
            echo "APK is debuggable — FAIL"
            exit 1
          fi
          case "$apk" in
            *debug*) echo "Path contains debug — FAIL"; exit 1 ;;
          esac
          echo "Release APK verification: PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Core source artifact
        run: tar -czf sentinel-core-${GITHUB_REF_NAME}.tar.gz server docs docker-compose.yml

      - name: Create GitHub release (release APK only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          if find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "Refusing to publish while debug APKs exist in workspace"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "$apk" \
            "sentinel-core-${GITHUB_REF_NAME}.tar.gz" \
            --generate-notes \
            --title "SENTINEL ${GITHUB_REF_NAME}"

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sentinel-release.jks"
