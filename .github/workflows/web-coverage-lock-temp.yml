name: Generate Web Coverage Lockfile

on:
  push:
    branches:
      - gpt/final-rc-consolidation-2026-09-25
    paths:
      - ".github/workflows/web-coverage-lock-temp.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate exact Web coverage lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate exact package metadata
        working-directory: web
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact --save-dev @vitest/coverage-v8@5.0.1
          npm pkg set 'scripts.test:coverage=vitest run --coverage'
      - name: Commit generated lockfile only to unchanged source branch
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git diff --check
          git add web/package.json web/package-lock.json
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(web): add deterministic Vitest coverage provider"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
