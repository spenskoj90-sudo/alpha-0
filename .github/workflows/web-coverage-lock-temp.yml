name: Measure Web Coverage

on:
  push:
    branches:
      - gpt/final-rc-consolidation-2026-09-25
    paths:
      - ".github/workflows/web-coverage-lock-temp.yml"

permissions:
  contents: read

jobs:
  measure:
    name: Measure Web production coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact repository graph
        working-directory: web
        run: npm ci
      - name: Install measurement-only coverage provider
        working-directory: web
        run: npm install --ignore-scripts --no-save --package-lock=false @vitest/coverage-v8@5.0.1
      - name: Measure all first-party TypeScript/TSX production modules
        working-directory: web
        run: |
          cat > vitest.coverage-temp.config.ts <<'EOF'
          import { defineConfig } from "vitest/config";

          export default defineConfig({
            test: {
              coverage: {
                provider: "v8",
                reporter: ["text", "json-summary"],
                include: ["app/**/*.{ts,tsx}"],
                exclude: ["app/**/*.test.ts", "app/**/*.test.tsx"],
              },
            },
          });
          EOF
          npx vitest run --config vitest.coverage-temp.config.ts --coverage
