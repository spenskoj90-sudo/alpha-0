name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash verify.sh

  core:
    name: Core tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q app migrate.py
      - run: pytest -m 'not postgres' --cov=app --cov-report=term-missing --cov-fail-under=80

  postgres:
    name: PostgreSQL integration and recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql+psycopg://sentinel:testpass@127.0.0.1:5432/sentinel_test
      PGOPTIONS: -c app.service_role=true
      SENTINEL_ENV: production
      SENTINEL_ENROLLMENT_TOKEN: pg-smoke:secret
      SENTINEL_REQUIRE_ENROLLMENT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python migrate.py
      - run: pytest -m postgres
      - name: Backup and restore smoke test
        run: |
          docker run --rm --network host -e PGPASSWORD=testpass postgres:18-alpine pg_dump -h 127.0.0.1 -p 5432 -U sentinel -d sentinel_test --no-owner --no-privileges > /tmp/sentinel-backup.sql
          PGPASSWORD=testpass psql -h 127.0.0.1 -U sentinel -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS sentinel_restore' -c 'CREATE DATABASE sentinel_restore'
          PGPASSWORD=testpass psql -h 127.0.0.1 -U sentinel -d sentinel_restore -v ON_ERROR_STOP=1 < /tmp/sentinel-backup.sql
          PGPASSWORD=testpass psql -h 127.0.0.1 -U sentinel -d sentinel_restore -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM identities LIMIT 1'

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug
      - run: ./gradlew --no-daemon test
      - name: Build instrumentation test APK
        run: ./gradlew --no-daemon assembleDebugAndroidTest
      - name: Upload Android instrumentation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha-0-android-instrumentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  android-instrumentation:
    name: Android instrumentation (GitHub Emulator)
    runs-on: ubuntu-latest
    needs: [android]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Enable KVM
        run: |
          sudo groupadd -f kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation on API 36 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: chmod +x ./gradlew && ./gradlew --no-daemon connectedDebugAndroidTest

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  launcher:
    name: Launcher runtime tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - run: npm test

  block-d-evidence:
    name: Block D operational evidence
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Run operational failure and CI-local performance evidence
        run: python scripts/block_d_evidence.py --output block-d-evidence.json
      - name: Run operational-plane regression tests
        run: pytest -q tests/test_operational_observability.py tests/test_operational_resilience.py
      - name: Upload exact-SHA Block D evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: block-d-operational-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: server/block-d-evidence.json
          if-no-files-found: error

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: [core, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: sentinel-core:ci

  deployment-smoke:
    name: Deployment smoke and health
    runs-on: ubuntu-latest
    needs: [core, postgres, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image
        run: docker build -f server/Dockerfile -t sentinel-core:smoke .
      - name: Start PostgreSQL
        run: |
          docker run -d --name sentinel-postgres -e POSTGRES_DB=sentinel -e POSTGRES_USER=sentinel -e POSTGRES_PASSWORD=testpass -p 5432:5432 postgres:18-alpine
          for i in {1..30}; do pg_isready -h 127.0.0.1 -p 5432 -U sentinel && break; sleep 2; done
      - name: Start API and verify health
        run: |
          docker run -d --name sentinel-api --network host -e DATABASE_URL=postgresql+psycopg://sentinel:testpass@127.0.0.1:5432/sentinel -e PGOPTIONS='-c app.service_role=true' -e SENTINEL_ENV=production -e SENTINEL_ENROLLMENT_TOKEN=smoke:secret -e SENTINEL_REQUIRE_ENROLLMENT=true sentinel-core:smoke
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 2; done
          docker logs sentinel-api
          exit 1
      - name: Verify applied schema readiness
        run: |
          set -euo pipefail
          docker exec sentinel-postgres psql -U sentinel -d sentinel -v ON_ERROR_STOP=1 -c "SELECT version FROM schema_migrations ORDER BY version"
          docker exec sentinel-postgres psql -U sentinel -d sentinel -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS migration_count FROM schema_migrations HAVING COUNT(*) >= 3"
          docker exec sentinel-postgres psql -U sentinel -d sentinel -v ON_ERROR_STOP=1 -c "SELECT to_regclass('public.sessions') AS sessions, to_regclass('public.device_bindings') AS device_bindings" | tee /tmp/schema-readiness.txt
          grep -q sessions /tmp/schema-readiness.txt
          grep -q device_bindings /tmp/schema-readiness.txt
      - name: Cleanup deployment smoke
        if: always()
        run: docker rm -f sentinel-api sentinel-postgres 2>/dev/null || true

  reproducible-deployment:
    name: Reproducible container build comparison
    runs-on: ubuntu-latest
    needs: [core, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build artifact A
        run: |
          docker buildx build --load --provenance=false --sbom=false -f server/Dockerfile -t sentinel-core:repro-a .
          docker image inspect sentinel-core:repro-a --format '{{.Id}}' > /tmp/repro-a.id
          docker image inspect sentinel-core:repro-a --format '{{json .RootFS.Layers}}' > /tmp/repro-a.layers
      - name: Independent rebuild artifact B
        run: |
          docker buildx prune -af
          docker buildx build --load --no-cache --provenance=false --sbom=false -f server/Dockerfile -t sentinel-core:repro-b .
          docker image inspect sentinel-core:repro-b --format '{{.Id}}' > /tmp/repro-b.id
          docker image inspect sentinel-core:repro-b --format '{{json .RootFS.Layers}}' > /tmp/repro-b.layers
      - name: Compare canonical runtime filesystem
        run: |
          set -euo pipefail
          echo "raw artifact A image id: $(cat /tmp/repro-a.id)"
          echo "raw artifact B image id: $(cat /tmp/repro-b.id)"
          echo "raw artifact A layers: $(cat /tmp/repro-a.layers)"
          echo "raw artifact B layers: $(cat /tmp/repro-b.layers)"
          rm -rf /tmp/repro-root-a /tmp/repro-root-b
          mkdir -p /tmp/repro-root-a /tmp/repro-root-b
          docker create --name sentinel-repro-a sentinel-core:repro-a >/dev/null
          docker create --name sentinel-repro-b sentinel-core:repro-b >/dev/null
          docker export sentinel-repro-a > /tmp/repro-a.raw.tar
          docker export sentinel-repro-b > /tmp/repro-b.raw.tar
          tar -xpf /tmp/repro-a.raw.tar -C /tmp/repro-root-a
          tar -xpf /tmp/repro-b.raw.tar -C /tmp/repro-root-b
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf /tmp/repro-a.canonical.tar -C /tmp/repro-root-a .
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -cf /tmp/repro-b.canonical.tar -C /tmp/repro-root-b .
          sha256sum /tmp/repro-a.canonical.tar /tmp/repro-b.canonical.tar
          cmp /tmp/repro-a.canonical.tar /tmp/repro-b.canonical.tar
          docker rm sentinel-repro-a sentinel-repro-b >/dev/null
